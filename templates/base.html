<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quote Desk</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    .best { background: #d4f7d4; font-weight: bold; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.85em; }
    .Open { background: #e0e0e0; }
    .Quoted { background: #cfe8ff; }
    .Expired { background: #ffd6d6; }
    .flash { background: #fff3cd; padding: 8px; margin: 1rem 0; }
    form label { display: block; margin: 6px 0; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}" style="text-decoration:none">Quote Desk</a></h1>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
